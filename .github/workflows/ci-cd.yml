name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit pytest pytest-cov pyinstaller

    - name: Dependency Scanning (PROC-06 / NFR-03)
      run: pip-audit || echo "Vulnerabilities found but continuing"

    - name: Static code analysis with Flake8 (PROC-04 / NFR-11)
      run: flake8 src --count --exit-zero --statistics

    - name: Security scan with Bandit (NFR-03)
      run: bandit -r src --exit-zero

    - name: Run unit tests (PROC-09 / TVR-01)
      run: python -m pytest tests/

    - name: Build Executable with PyInstaller (FR-01)
      run: pyinstaller --onefile --windowed --name SecureLogAnalyzer src/main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureLogAnalyzer-Windows-EXE
        path: dist/SecureLogAnalyzer.exe